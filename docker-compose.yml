services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    expose:
      - "3306"  # Expose MySQL internally without publishing to the host
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  # Node.js API Service
  api:
    build: .
    container_name: api-container
    restart: always
    ports:
      - "${API_PORT}:${API_PORT}"  # Publish API externally
    depends_on:
      - db  # Ensure MySQL starts first
    environment:
      DATABASE_URL: "mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}"  # Prisma connection string
    volumes:
      - .:/app
    working_dir: /app  # Ensure commands run in the correct directory
    command: sh -c "npx prisma migrate deploy && npm start"  # Run Prisma migrations & start API
    networks:
      - app-network  # Attach to the same network as MySQL

# Volume to persist database data
volumes:
  db_data:

# Custom network to isolate services
networks:
  app-network:
    driver: bridge
